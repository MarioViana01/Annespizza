<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Anne's Pizza</title>

    <!-- Fonte -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="cadastro">

    <!-- Logo -->

    <div class="logo">

        <img src="img\Anne's pizza 1.png" alt="Anne's Pizza">

    </div>

    <!-- Título -->

    <h1>CRIAR CONTA</h1>

    <!-- Formulário -->

    <form id="cadastroForm">

        <!-- Dados pessoais -->

        <div class="grupo">

            <label>Nome Completo</label>

            <input
                type="text"
                placeholder=""
                required
            >

        </div>

        <div class="duas-colunas">

            <div class="grupo">

                <label>Telefone / WhatsApp</label>

                <input
                    id="telefone"
                    type="text"
                    placeholder="( )"
                    required
                >

            </div>

            <div class="grupo">

                <label>E-mail</label>

                <input
                    type="email"
                    required
                >

            </div>

        </div>

        <div class="duas-colunas">

            <div class="grupo">

                <label>Senha</label>

                <div class="senha">

                    <input
                        id="senha"
                        type="password"
                        required
                    >

                    <i class="fa-solid fa-eye"></i>

                </div>

            </div>

            <div class="grupo">

                <label>Confirmar Senha</label>

                <div class="senha">

                    <input
                        id="confirmar"
                        type="password"
                        required
                    >

                    <i class="fa-solid fa-eye"></i>

                </div>

            </div>

        </div>

        <!-- Endereço -->

        <h2>ENDEREÇO DE ENTREGA</h2>

        <div class="duas-colunas">

            <div class="grupo pequeno">

                <label>CEP*</label>

                <input
                    id="cep"
                    type="text"
                    required
                >

            </div>

            <div class="grupo">

                <label>Rua / Avenida*</label>

                <input
                    type="text"
                    required
                >

            </div>

        </div>

        <div class="tres-colunas">

            <div class="grupo">

                <label>Número*</label>

                <input
                    type="text"
                    required
                >

            </div>

            <div class="grupo">

                <label>Complemento</label>

                <input
                    type="text"
                >

            </div>

            <div class="grupo">

                <label>Bairro*</label>

                <input
                    type="text"
                    required
                >

            </div>

        </div>
                <div class="duas-colunas">

            <div class="grupo">

                <label>Cidade*</label>

                <input
                    type="text"
                    required
                >

            </div>

            <div class="grupo">

                <label>Estado*</label>

                <input
                    type="text"
                    required
                >

            </div>

        </div>

        <!-- Newsletter -->

        <div class="checkbox">

            <label>

                <input
                    type="checkbox"
                    checked
                >

                <span class="checkmark"></span>

                Sim, quero receber novidades pelo e-mail e WhatsApp!

            </label>

        </div>

        <!-- Botão -->

        <button
            type="submit"
            class="btn-cadastro"
        >

            <i class="fa-solid fa-user"></i>

            CRIAR CONTA

        </button>

    </form>

    <!-- Rodapé -->

    <footer>

        <div class="footer-logo">

            <img
                src="img\Anne's pizza 1.png"
                alt="Anne's Pizza"
            >

            <p>
                Sabor que conquista,<br>
                qualidade que fica!
            </p>

            <div class="redes">

                <a href="#"><i class="fa-brands fa-instagram"></i></a>

                <a href="#"><i class="fa-brands fa-facebook"></i></a>

                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>

            </div>

        </div>

        <div class="footer-item">

            <i class="fa-solid fa-phone"></i>

            <div>

                <h3>TELEFONE</h3>

                <p>(11) 99999-9999</p>

                <p>(11) 2222-2222</p>

            </div>

        </div>

        <div class="footer-item">

            <i class="fa-regular fa-clock"></i>

            <div>

                <h3>HORÁRIO DE FUNCIONAMENTO</h3>

                <p>Todos os dias</p>

                <p>18h às 23h</p>

            </div>

        </div>

        <div class="footer-item">

            <i class="fa-solid fa-location-dot"></i>

            <div>

                <h3>ENDEREÇO</h3>

                <p>Rua das Pizzas, 123</p>

                <p>Maceió - AL</p>

            </div>

        </div>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
